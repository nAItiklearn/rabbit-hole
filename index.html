<!DOCTYPE html>
<html>
<head>
    <title>Rabbit Hole</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="page-overlay"></div>
    <header class="top-bar">
        <div class="logo">
            <div class="bunny"></div>
            <span> Rabbit Hole</span>
        </div>
    </header>

    <!-- Main page-->
    <main class="home-page">
        <section class="hero">
            <h1 class="main-title">what do you wish to learn about today?</h1>
            <div class="search-area">
                <div class="fake-search">LETS DIVE</div>
                <button class="surprise-button">
                    <img src="assests/home/surprise-button.png">
                </button>

            </div>
        </section>

        <!--making categories for 3 topics-->
        <section class="category-area">
            <button class="category-card history-card" id="history-button">
                <img src="assests/home/histroy-button.png" alt="history">
            </button>
            <button class="category-card cinema-card" id="cinema-button">
                <img src="assests/home/cinema-button.png" alt="cinema">
            </button>
            <button class="category-card internet-card" id="internet-button">
            <img src="assests/home/internet.png" alt="internet">
            </button>
        </section>
        <div id="rabbit-result" class="rabbit-result"> </div>
    </main>
</body>


</html>
