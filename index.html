<!DOCTYPE html>
<html lang="en">
    <head>
       <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rabbit Hole</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    </head>
    
    <body>
        <div class="page-overlay"></div>
        <header class="top-bar">
            <div class="logo">
                 🐇 Rabbit Hole
            </div>
            <button class="theme-button">
                 ☀ / 🌙
            </button>
        </header>
        
        <main class="home-page">
            <section class="hero">
                <h1 class="main-title">
                    WHERE SHOULD WE FALL?
                </h1>
                <div class="search-area">
                    <div class="fake-search">
                        give me something weird..
                    </div>
                    <button class="surprise-button">
                        🎲 SURPRISE ME
                    </button>      
                </div>
            </section>
            <section class="category-area">
                <button class="category-card history-card" id="history-button">
                    <span class="category-icon">🌲</span>
                    <span>HISTORY WOODS</span>
                </button>
                <button class="category-card cinema-card" id="cinema-button">
                    <span class="category-icon">🎬</span>
                    <span>CINEMA CAVE</span>
                </button>
                <button class="category-card internet-card" id="internet-button">
                    <span class="category-icon">🌐</span>
                    <span>INTERNET</span>
                </button>
            </section>
            <!-- RABBIT START POSITION-->
             <div class="rabbit-container">
               <img
                   class="rabbit"
                   id="rabbit"
                   src="assests/home/rabbit.png"
                   alt="pixel rabbit"
               >
             </div>

             <div id="rabbit-result" class="rabbit-result">
             </div>
             
        </main>
    </body>
</html>
